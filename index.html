<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绿野守望 - 环境保护</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a1f0d;
      --bg-mid: #122a14;
      --fg: #e8f5e9;
      --fg-muted: #a5d6a7;
      --accent: #4caf50;
      --accent-glow: #81c784;
      --gold: #d4a574;
      --gold-soft: #c9a66b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-deep);
      color: var(--fg);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-serif {
      font-family: 'Noto Serif SC', serif;
    }

    /* 主背景层 */
    .main-bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(76, 175, 80, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(129, 199, 132, 0.1) 0%, transparent 40%),
        radial-gradient(ellipse 50% 30% at 80% 60%, rgba(76, 175, 80, 0.08) 0%, transparent 35%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, #0d2810 100%);
      z-index: -3;
    }

    /* 动态波纹背景 */
    .wave-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      opacity: 0.4;
    }

    .wave-bg::before,
    .wave-bg::after {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle, rgba(76, 175, 80, 0.03) 0%, transparent 50%);
      animation: waveRotate 60s linear infinite;
    }

    .wave-bg::after {
      animation: waveRotate 45s linear infinite reverse;
      background: radial-gradient(circle, rgba(129, 199, 132, 0.02) 0%, transparent 40%);
    }

    @keyframes waveRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 粒子画布 */
    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* 鼠标涟漪 */
    .ripple {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: rippleExpand 1s ease-out forwards;
      z-index: 1000;
    }

    @keyframes rippleExpand {
      0% {
        width: 20px;
        height: 20px;
        opacity: 0.8;
      }
      100% {
        width: 150px;
        height: 150px;
        opacity: 0;
      }
    }

    /* 主容器 */
    .hero-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
    }

    /* 主标题动画 */
    .main-title {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--fg) 0%, var(--accent-glow) 50%, var(--fg-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      opacity: 0;
      animation: titleReveal 1.5s ease-out 0.3s forwards;
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 装饰线 */
    .deco-line {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 2rem 0;
      opacity: 0;
      animation: lineReveal 1s ease-out 0.8s forwards;
    }

    @keyframes lineReveal {
      0% {
        opacity: 0;
        width: 0;
      }
      100% {
        opacity: 1;
        width: 120px;
      }
    }

    /* 诗歌容器 */
    .poem-container {
      max-width: 800px;
      padding: 3rem 2rem;
      position: relative;
    }

    .poem-card {
      background: linear-gradient(145deg, rgba(18, 42, 20, 0.8), rgba(10, 31, 13, 0.9));
      border: 1px solid rgba(76, 175, 80, 0.2);
      border-radius: 12px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: cardReveal 1s ease-out 1.2s forwards;
    }

    @keyframes cardReveal {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .poem-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--gold), var(--accent), transparent);
    }

    .poem-title {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      color: var(--gold);
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.15em;
    }

    .poem-content {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 2.4;
      color: var(--fg);
      text-align: center;
      letter-spacing: 0.08em;
    }

    .poem-content p {
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
    }

    .poem-content p.visible {
      animation: poemLineReveal 0.8s ease-out forwards;
    }

    @keyframes poemLineReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .poem-author {
      text-align: right;
      margin-top: 2rem;
      font-size: 1rem;
      color: var(--fg-muted);
      font-style: italic;
    }

    /* 底部信息区 */
    .info-section {
      padding: 4rem 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
    }

    .info-card {
      background: rgba(18, 42, 20, 0.6);
      border: 1px solid rgba(76, 175, 80, 0.15);
      border-radius: 8px;
      padding: 2rem;
      width: min(280px, 100%);
      text-align: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(30px);
    }

    .info-card.visible {
      animation: cardItemReveal 0.6s ease-out forwards;
    }

    @keyframes cardItemReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .info-card:hover {
      background: rgba(76, 175, 80, 0.1);
      border-color: rgba(76, 175, 80, 0.4);
      transform: translateY(-5px);
    }

    .info-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      color: var(--accent);
    }

    .info-card h3 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }

    .info-card p {
      font-size: 0.9rem;
      color: var(--fg-muted);
      line-height: 1.6;
    }

    /* 装饰性植物图案 */
    .plant-pattern {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(to top, rgba(10, 31, 13, 0.9), transparent);
      pointer-events: none;
      z-index: 10;
    }

    /* 呼吸灯效果 */
    .breathing-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(76, 175, 80, 0.15) 0%, transparent 70%);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    /* 滚动提示 */
    .scroll-hint {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeInUp 1s ease-out 2s forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 0.6; }
    }

    .scroll-hint span {
      font-size: 0.75rem;
      color: var(--fg-muted);
      letter-spacing: 0.1em;
    }

    .scroll-arrow {
      width: 24px;
      height: 24px;
      color: var(--accent);
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* 页脚 */
    footer {
      padding: 2rem;
      text-align: center;
      border-top: 1px solid rgba(76, 175, 80, 0.1);
      background: rgba(10, 31, 13, 0.8);
    }

    footer p {
      font-size: 0.85rem;
      color: var(--fg-muted);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 响应式 */
    @media (max-width: 640px) {
      .poem-card {
        padding: 2rem 1.5rem;
      }
      
      .info-section {
        padding: 2rem 1rem;
      }
      
      .info-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="main-bg"></div>
  <div class="wave-bg"></div>
  <canvas id="particle-canvas"></canvas>
  
  <div class="breathing-glow" style="top: 20%; left: 10%;"></div>
  <div class="breathing-glow" style="top: 60%; right: 5%; animation-delay: -2s;"></div>

  <main>
    <section class="hero-section">
      <h1 class="main-title font-serif">绿野守望</h1>
      <div class="deco-line"></div>
      
      <div class="poem-container">
        <div class="poem-card">
          <h2 class="poem-title font-serif">给地球的诗</h2>
          <div class="poem-content font-serif">
            <p>青山隐隐水迢迢，翠影婆娑入云霄。</p>
            <p>风过林梢低语诉，千年守护不曾遥。</p>
            <p>溪流清澈映天光，万物生息共一方。</p>
            <p>愿以寸心护碧土，留得绿意满山岗。</p>
            <p>莫待荒芜空叹息，且将行动化春泥。</p>
            <p>子孙后代同仰望，蓝天碧水永相依。</p>
            <div class="poem-author">—— 守望者</div>
          </div>
        </div>
      </div>
      
      <div class="scroll-hint">
        <span>向下探索</span>
        <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M19 12l-7 7-7-7"/>
        </svg>
      </div>
    </section>

    <section class="info-section">
      <div class="info-card">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 22c4-4 8-7.5 8-12a8 8 0 10-16 0c0 4.5 4 8 8 12z"/>
          <path d="M12 12a2 2 0 100-4 2 2 0 000 4z"/>
        </svg>
        <h3>守护森林</h3>
        <p>每一棵树都是地球的肺，吸收二氧化碳，释放清新氧气，守护生命的呼吸。</p>
      </div>
      
      <div class="info-card">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/>
        </svg>
        <h3>珍惜水源</h3>
        <p>水是生命之源，每一滴都弥足珍贵。保护河流湖泊，让清澈永续流淌。</p>
      </div>
      
      <div class="info-card">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
        </svg>
        <h3>共筑未来</h3>
        <p>环境保护始于足下，每一次选择都在书写地球明天的篇章。</p>
      </div>
    </section>
  </main>

  <footer>
    <p>守护绿色家园，从你我做起</p>
  </footer>

  <script>
    // 粒子系统初始化
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId = null;
    let mouseX = 0;
    let mouseY = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 粒子类
    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height - canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 0.5 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.hue = Math.random() * 40 + 100; // 绿色范围
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        
        // 轻微的鼠标影响
        const dx = mouseX - this.x;
        const dy = mouseY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          this.x -= dx * 0.01;
          this.y -= dy * 0.01;
        }

        if (this.y > canvas.height + 10) {
          this.reset();
          this.y = -10;
        }
      }

      draw() {
        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, Math.max(0.1, this.size * 2)
        );
        gradient.addColorStop(0, `hsla(${this.hue}, 70%, 60%, ${this.opacity})`);
        gradient.addColorStop(1, `hsla(${this.hue}, 70%, 60%, 0)`);
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.size * 2), 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }
    }

    // 初始化粒子
    const particleCount = Math.min(80, Math.floor(window.innerWidth / 20));
    for (let i = 0; i < particleCount; i++) {
      const p = new Particle();
      p.y = Math.random() * canvas.height;
      particles.push(p);
    }

    // 动画循环
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      
      animationId = requestAnimationFrame(animate);
    }

    // 检查 reduced motion 偏好
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!prefersReducedMotion) {
      animate();
    }

    // 鼠标涟漪效果
    document.addEventListener('click', (e) => {
      if (prefersReducedMotion) return;
      
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      
      setTimeout(() => ripple.remove(), 1000);
    });

    // 鼠标位置追踪
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // 滚动显示动画
    const observerOptions = {
      threshold: 0.2,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    // 观察信息卡片
    document.querySelectorAll('.info-card').forEach((card, index) => {
      card.style.animationDelay = `${index * 0.15}s`;
      observer.observe(card);
    });

    // 诗句逐行显示
    const poemLines = document.querySelectorAll('.poem-content p');
    const poemObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          poemLines.forEach((line, index) => {
            setTimeout(() => {
              line.classList.add('visible');
            }, index * 200);
          });
          poemObserver.disconnect();
        }
      });
    }, { threshold: 0.5 });

    const poemCard = document.querySelector('.poem-card');
    if (poemCard) {
      poemObserver.observe(poemCard);
    }

    // 平滑滚动隐藏提示
    window.addEventListener('scroll', () => {
      const scrollHint = document.querySelector('.scroll-hint');
      if (scrollHint && window.scrollY > 100) {
        scrollHint.style.opacity = '0';
        scrollHint.style.transition = 'opacity 0.5s';
      }
    });
  </script>
</body>
</html>
